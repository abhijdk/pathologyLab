server:
  # Render automatically provides a PORT environment variable.
  # This defaults to 8080 if running locally.
  port: ${PORT:8080}

spring:
  application:
    name: Pathology-Lab-System

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/healthcare}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Hibernate & JPA Configuration
  jpa:
    hibernate:
      # 'update' automatically creates/updates tables based on your @Entity classes
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        type:
          json_format_mapper: jackson

# Custom JWT Security Configuration
security:
  jwt:
    secret-key: ${JWT_SECRET:saiofal_lafkjsjejkjlkjdajflaksjflkjlkfja_make_sure_this_is_64_chars_long}
    issuer: ${JWT_ISSUER:api.pathologylab.com}
    access-ttl-seconds: ${JWT_ACCESS_TTL:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL:86400}
    refresh-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refresh_token}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

# Optional: Logging configuration to help debug issues on Render
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG